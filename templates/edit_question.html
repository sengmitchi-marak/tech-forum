<!DOCTYPE html>
<html>
<head>
    <head>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/common.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/edit.css') }}">

    <title>Edit Question</title>
</head>
    
    <title>Edit Question</title>
</head>
<body>

<div class="edit-container">

    <h2>✏️ Edit Question</h2>

    <form method="POST" class="edit-form">

        <label>Question Title</label>

        <input
            type="text"
            name="title"
            value="{{ question[1] }}"
            required>

        <label>Question Description</label>

        <textarea
            name="description"
            required>{{ question[2] }}</textarea>

        <div class="edit-buttons">

            <button type="submit" class="update-btn">
                Update Question
            </button>

            <a href="/question/{{ question[0] }}"
               class="cancel-btn">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
